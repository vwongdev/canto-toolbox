<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Review – Canto Toolbox</title>
  <link rel="stylesheet" href="./flashcards.scss">
</head>
<body>
  <div id="loading" class="screen">
    <p>Loading flashcards…</p>
  </div>

  <div id="empty-state" class="screen" style="display: none;">
    <div class="empty-icon" lang="zh" aria-hidden="true">字</div>
    <!-- Set by renderEmptyState: the copy depends on whether anything is due. -->
    <p></p>
    <button class="btn btn-secondary stats-link" type="button">Your statistics</button>
  </div>

  <div id="review" class="screen" style="display: none;">
    <div class="progress-bar-container">
      <div id="progress" class="progress-bar"></div>
    </div>
    <div class="counter-row">
      <span id="counter">Card 1 of 1</span>
      <button id="know-btn" class="btn btn-subtle btn-know" title="Stop reviewing this word">I know this<kbd class="key-hint">K</kbd></button>
    </div>

    <!-- Retiring a word buries every card it owns, so it says so and offers
         the one press that takes it back. -->
    <div id="retired-notice" class="retired-notice" role="status" style="display: none;">
      <span id="retired-message"></span>
      <button id="undo-retire-btn" class="retired-undo" type="button">Undo</button>
    </div>

    <div id="card" class="card">
      <div id="card-front" class="card-front"></div>
      <div id="card-back" class="card-back" style="display: none;"></div>
    </div>

    <div id="show-answer-btn-container">
      <button id="show-answer-btn" class="btn btn-show-answer">Show Answer<kbd class="key-hint">Space</kbd></button>
    </div>

    <div id="writing-next" class="writing-next" style="display: none;">
      <button id="writing-next-btn" class="btn btn-primary">Next<kbd class="key-hint">Space</kbd></button>
    </div>

    <div id="rating-btns" class="rating-btns" style="display: none;">
      <button class="btn btn-again" data-rating="again">Again<kbd class="key-hint">1</kbd></button>
      <button class="btn btn-hard" data-rating="hard">Hard<kbd class="key-hint">2</kbd></button>
      <button class="btn btn-good" data-rating="good">Good<kbd class="key-hint">3</kbd></button>
      <button class="btn btn-easy" data-rating="easy">Easy<kbd class="key-hint">4</kbd></button>
    </div>
  </div>

  <div id="finished" class="screen" style="display: none;">
    <div class="finished-icon">✓</div>
    <h1>Session Complete</h1>
    <p id="result-summary" class="result-summary"></p>
    <div class="finished-actions">
      <button id="review-again-btn" class="btn btn-primary">Review Again<kbd class="key-hint">Enter</kbd></button>
      <!-- The page is opened in a tab of its own, so without this the only way
           on from a finished session is to close it. -->
      <button class="btn btn-secondary stats-link" type="button">Your statistics</button>
    </div>
  </div>

  <script type="module" src="./flashcards.ts"></script>
</body>
</html>
